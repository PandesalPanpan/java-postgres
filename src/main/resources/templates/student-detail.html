<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Student: ' + ${student.fullName}">Student Detail</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <header>
            <h1 th:text="${student.fullName}">Student Name</h1>
            <a href="/" class="btn btn-back">← Back to List</a>
        </header>

        <div class="message" th:if="${message}" th:text="${message}"></div>

        <section class="add-subject">
            <h2>Add Subject Grade</h2>
            <form method="post" th:action="@{/students/{id}/subjects(id=${student.id})}">
                <div class="form-row">
                    <input type="text" name="subjectName" placeholder="Subject Name" required>
                    <input type="text" name="subjectCode" placeholder="Subject Code" required>
                </div>
                <div class="form-row">
                    <input type="text" name="semester" placeholder="Semester (e.g., 1st)" required>
                    <input type="text" name="schoolYear" placeholder="School Year (e.g., 2025-2026)" required>
                </div>
                <div class="form-row">
                    <input type="number" name="grade" step="0.01" min="0" max="100" placeholder="Grade" required>
                    <button type="submit">Add Subject</button>
                </div>
            </form>
        </section>

        <section class="grades-list">
            <h2>Subject Grades</h2>
            <div th:if="${subjectGrades == null or subjectGrades.isEmpty()}" class="empty-state">
                <p>No subject grades found. Add a subject grade to get started.</p>
            </div>
            <table th:if="${subjectGrades != null and !subjectGrades.isEmpty()}">
                <thead>
                    <tr>
                        <th>Subject Name</th>
                        <th>Subject Code</th>
                        <th>Semester</th>
                        <th>School Year</th>
                        <th>Grade</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="subject : ${subjectGrades}">
                        <td th:text="${subject.subjectName}"></td>
                        <td th:text="${subject.subjectCode}"></td>
                        <td th:text="${subject.semester}"></td>
                        <td th:text="${subject.schoolYear}"></td>
                        <td th:text="${subject.grade}" class="grade"></td>
                        <td>
                            <form method="post" th:action="@{/subjects/{id}/delete(id=${subject.id})}" style="display: inline;">
                                <input type="hidden" name="studentId" th:value="${student.id}">
                                <button type="submit" class="btn btn-delete" onclick="return confirm('Are you sure?')">Delete</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>
</body>
</html>
